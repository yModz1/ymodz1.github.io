name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          AD546B: ${{ secrets.AD546B }}
          B59FD9: ${{ secrets.B59FD9 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AD546B', '')
          tag_b = os.environ.get('B59FD9', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 67ebf194b132e692daa40ed5b0e377d74df048 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 3a9b405c6aa06aeadf7cf906c655 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
